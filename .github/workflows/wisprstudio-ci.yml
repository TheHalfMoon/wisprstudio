name: WisprStudio CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wisprstudio-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  qualification:
    name: WisprStudio Qualification Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install lightweight Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyyaml fastapi starlette httpx cryptography numpy pydantic pillow packaging jsonschema python-multipart uvicorn psutil alembic python-dotenv requests tqdm platformdirs pytest-subtests

      - name: Run WisprStudio Python contract & qualification suites
        run: |
          pytest \
            tests/test_wisprstudio_st1_foundation.py \
            tests/test_wisprstudio_qualification.py \
            tests/test_tts_model_licence_gate.py \
            tests/test_voicestudio_branding.py \
            tests/test_contact_emails.py \
            tests/test_hf_mirror_settings.py \
            tests/test_mobile_contract.py \
            tests/test_electron_transition.py \
            tests/test_electron_release_assets.py \
            tests/test_agent_skill_discovery.py \
            tests/test_update_contributors.py \
            -v

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.15"

      - name: Install Electron dependencies & check 22 locales
        working-directory: electron
        run: |
          bun install --no-save
          bun run locale:check

      - name: Run Electron packaging & store manifest contract tests
        run: |
          node --test \
            electron/tests/snap-store-packaging.test.mjs \
            electron/tests/snap-artifact-verification.test.mjs \
            electron/tests/store-artifact-manifest.test.mjs \
            electron/tests/microsoft-store-handoff.test.mjs
